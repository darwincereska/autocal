[package]
name = "autocal"
version = "0.1.0"
edition = "2024"
authors = ["Darwin Cereska <discorddurr@gmail.com>"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/darwincereska/autocal"
documentation = "https://docs.rs/autocal"
description = "A set-and-forget calendar invitation service"


[dependencies]
chrono = "0.4.45"
google-calendar = "0.10.0"
# gotify = "0.4.0"
log = "0.4.33"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
simple_logger = "5.2.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
url = "2.5.8"
